# Configuración relevante de FortiGate - Infraestructura 3
# Backup original generado desde GUI. Credenciales y PSK redactadas.

config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.200.2 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.15.73.129 255.255.255.240
        set allowaccess ping
        set type physical
        set alias "SERVER-LAN"
        set device-identification enable
        set lldp-transmission enable
        set role lan
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set ip 203.0.113.165 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN-FG"
        set lldp-reception enable
        set role wan
        set snmp-index 3
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 12
    next
    edit "VPN-REMOTE-SSH"
        set vdom "root"
        set type tunnel
        set snmp-index 15
        set interface "port3"
    next
end

config firewall address
    edit "SERVER-NET"
        set associated-interface "port2"
        set subnet 10.15.73.128 255.255.255.240
    next
    edit "WEB-SRV"
        set associated-interface "port2"
        set subnet 10.15.73.130 255.255.255.255
    next
    edit "VPN-REMOTE-SSH_range"
        set type iprange
        set comment "VPN: VPN-REMOTE-SSH (Created by VPN wizard)"
        set start-ip 10.212.135.200
        set end-ip 10.212.135.210
    next
end

config firewall vip
    edit "WEB-HTTPS-PUBLIC"
        set extip 203.0.113.165
        set mappedip "10.15.73.130"
        set extintf "port3"
        set portforward enable
        set extport 443
        set mappedport 443
    next
end

config router static
    edit 1
        set gateway 203.0.113.166
        set device "port3"
    next
    edit 2
        set dst 10.212.0.0 255.255.0.0
        set device "l2t.root"
        set comment "VPN: VPN-REMOTE-SSH (Created by VPN wizard)"
    next
    edit 3
        set dst 10.212.135.0 255.255.255.0
        set device "l2t.root"
    next
end

config user local
    edit "vpnuser"
        set type password
        set passwd <REDACTED>
    next
end

config user group
    edit "VPN-USERS"
        set member "vpnuser"
    next
end

config vpn ipsec phase1-interface
    edit "VPN-REMOTE-SSH"
        set type dynamic
        set interface "port3"
        set peertype any
        set net-device disable
        set proposal des-sha1
        set comments "VPN: VPN-REMOTE-SSH (Created by VPN wizard)"
        set dhgrp 2
        set psksecret <REDACTED>
    next
end

config vpn ipsec phase2-interface
    edit "VPN-REMOTE-SSH"
        set phase1name "VPN-REMOTE-SSH"
        set proposal des-sha1
        set pfs disable
        set encapsulation transport-mode
        set l2tp enable
        set comments "VPN: VPN-REMOTE-SSH (Created by VPN wizard)"
        set keylifeseconds 3600
    next
end

config vpn l2tp
    set status enable
    set eip 10.212.135.210
    set sip 10.212.135.200
    set usrgrp "VPN-USERS"
end

config firewall policy
    edit 1
        set name "WAN-to-WEB-HTTPS"
        set srcintf "port3"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "WEB-HTTPS-PUBLIC"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 3
        set name "vpn_VPN-REMOTE-SSH_l2tp"
        set srcintf "VPN-REMOTE-SSH"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "L2TP"
        set comments "VPN: VPN-REMOTE-SSH (Created by VPN wizard)"
    next
    edit 4
        set name "vpn_VPN-REMOTE-SSH_remote_0"
        set srcintf "l2t.root"
        set dstintf "port2"
        set action accept
        set srcaddr "VPN-REMOTE-SSH_range"
        set dstaddr "SERVER-NET"
        set schedule "always"
        set service "ALL"
        set nat enable
        set comments "VPN: VPN-REMOTE-SSH (Created by VPN wizard)"
    next
    edit 5
        set name "VPN-to-SERVER-SSH"
        set srcintf "l2t.root"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "WEB-SRV"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
end
